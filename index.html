<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DCME-B Face Identification</title>

<style>
body{
    text-align:center;
    font-family:Arial;
    background:#f0f0f0;
}

video{
    border:3px solid black;
    border-radius:8px;
    margin-top:20px;
}

canvas{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    margin-top:20px;
}

#result{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
    background:white;
    padding:10px;
    border-radius:8px;
    display:inline-block;
}
</style>

</head>

<body>

<h2>DCME-B Face Identification</h2>

<div style="position:relative; display:inline-block;">
    
    <video id="video" width="720" height="560" autoplay muted playsinline></video>
    
    <canvas id="overlay" width="720" height="560"></canvas>

</div>

<br><br>

<h3 id="result">Starting camera...</h3>

<script src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
<script src="script.js"></script>

</body>
</html>
