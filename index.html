<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DCME-B Face Identification</title>

<style>
body{
    text-align:center;
    font-family:Arial;
    background:#f0f0f0;
}

.container{
    position:relative;
    display:inline-block;
}

video{
    border:3px solid black;
    border-radius:8px;
}

canvas{
    position:absolute;
    top:0;
    left:0;
}

#result{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
    background:white;
    padding:10px;
    border-radius:8px;
    display:inline-block;
}
</style>

</head>

<body>

<h2>DCME-B Face Identification</h2>

<div class="container">
    <video id="video" width="480" height="360" autoplay muted playsinline></video>
    <canvas id="overlay" width="480" height="360"></canvas>
</div>

<br><br>

<h3 id="result">Starting camera...</h3>

<script src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
<script src="script.js"></script>

</body>
</html>
